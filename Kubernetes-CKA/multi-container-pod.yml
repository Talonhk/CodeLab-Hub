apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  volumes:
  - name: log-files
    emptyDir: {}
  containers:
  - name: web-server
    image: nginx
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    volumeMounts:
    - name: log-files
      mountPath: /var/log/nginx
  - name: web-logger
    image: busybox:1.30.1
    command: [ "sh", "-c", "while true; do cat /var/log/nginx/access.log; sleep 30; done" ]
    resources:
      requests:
        memory: "32Mi"
        cpu: "100m"
      limits:
        memory: "64Mi"
        cpu: "200m"
    volumeMounts:
    - name: log-files
      mountPath: /var/log/nginx

# kubectl logs multi-container-pod -c web-logger (no returned log data yet)

# kubectl exec multi-container-pod -it â€“ sh
# curl 127.0.0.1 (this generates web server log activity)
# ctl logs multi-container-pod -c web-logger (now log data is returned by the sidecar container)
