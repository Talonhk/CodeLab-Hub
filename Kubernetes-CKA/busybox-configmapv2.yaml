---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-deployment
  namespace: learning-cka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox-container
        image: busybox:1.30.1
        command: [ 'sh', '-c', 'while true; do date; sleep 3; done' ]
        env:
        - name: pod-app-settings
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: apply_user_rbac
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
