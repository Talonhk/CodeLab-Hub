# nginx.yaml file that is for makeing a Pod with resource requests and limits, can not make replica set

apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod1

spec:
  containers:
  - name: nginx-container1
    image: nginx
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
