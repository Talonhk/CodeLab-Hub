spring.datasource.url=jdbc:mysql://${DB_HOST:mysql.database.svc.cluster.local}:3306/${DB_NAME:appdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASS:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080
