apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-serve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-serve
  template:
    metadata:
      labels:
        app: mlops-serve
    spec:
      containers:
      - name: mlops-serve
        image: mlops-serve:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_PATH
          value: "/app/models/iris_rf.pkl"
