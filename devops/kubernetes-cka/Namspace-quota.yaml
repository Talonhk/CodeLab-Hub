apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-values
  namespace: learning-cka
data:
  limits.memory: "800Mi"
  limits.cpu: "800m"
  requests.memory: "600Mi"
  requests.cpu: "400m"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-pods
  namespace: learning-cka
spec:
  hard:
    pods: "3"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 3Gi
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  namespace: learning-cka
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          limits:
            memory: "800Mi"
            cpu: "800m"
          requests:
            memory: "600Mi"
            cpu: "400m"
        envFrom:
        - configMapRef:
            name: shared-values
