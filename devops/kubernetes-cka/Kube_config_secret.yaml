apiVersion: v1
kind: Secret
metadata:
  name: mysecret
  namespace: learning-cka
type: Opaque
data:
  username: YWRtaW4=
  password: MWYyZDFlMmU2N2Rm
---
apiVersion: v1
kind: Pod
metadata:
  name: pod1
  namespace: learning-cka
spec:
  containers:
  - name: redis
    image: redis
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    env:
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: secret-from-manifest
          key: username
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: secret-from-manifest
          key: password
