apiVersion: audit.k8s.io/v1
kind: Policy
metadata:
  name: audit-policy
rules:
- level: Metadata
  verbs: [ "create", "update", "patch", "delete" ]
  resources:
  - group: ""
    resources: [ "pods", "secrets", "configmaps" ]
  - group: "apps"
    resources: [ "deployments", "statefulsets", "daemonsets" ]
