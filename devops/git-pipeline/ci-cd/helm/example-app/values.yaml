replicaCount: 2

deploymentName: java-deployment
serviceName: example-service
appLabel: example-app

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

container:
  name: example-container
  port: 80

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    memory: "64Mi"
    cpu: "250m"
  limits:
    memory: "128Mi"
    cpu: "500m"
