{{- if .Values.languageApps.enabled }}
{{- range .Values.languageApps.deployments }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.languageApps.namespace }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .label }}
  template:
    metadata:
      labels:
        app: {{ .label }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          command: ["bash", "--noprofile", "--norc", "-lc"]
          args:
            - |
              export PS1="[{{ .name }}] \u@\h:\w\$ ";
              echo "{{ .displayName }} test container ready";
              echo "DB_HOST={{ $.Values.languageApps.dbHost }}";
              while true; do sleep 3600; done
          readinessProbe:
            exec:
              command: ["bash", "-lc", "test -n \"$DB_HOST\""]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: DB_HOST
              value: {{ $.Values.languageApps.dbHost | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.mysqlCredentialsSecretName }}
                  key: {{ $.Values.secrets.appDatabaseKey }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.mysqlCredentialsSecretName }}
                  key: {{ $.Values.secrets.appUserKey }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.mysqlCredentialsSecretName }}
                  key: {{ $.Values.secrets.appPasswordKey }}
          resources:
            {{- toYaml $.Values.languageApps.resources | nindent 12 }}
---
{{- end }}
{{- end }}
