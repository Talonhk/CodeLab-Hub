apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-test
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: python-test
  template:
    metadata:
      labels:
        app: python-test
    spec:
      containers:
      - name: python-test
        image: python:3.12
        command: [ "bash", "--noprofile", "--norc", "-lc" ]
        args:
        - |
          export PS1="[python-test] \u@\h:\w\$ ";
          echo "Python test container ready";
          echo "DB_HOST=mysql.database.svc.cluster.local";
          while true; do sleep 3600; done
        readinessProbe:
          exec:
            command: [ "bash", "-lc", "test -n \"$DB_HOST\"" ]
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: DB_HOST
          value: mysql.database.svc.cluster.local
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: app-database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: app-user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: app-password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
